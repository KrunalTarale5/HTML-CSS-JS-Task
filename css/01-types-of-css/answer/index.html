<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three ways to add CSS</title>
  <style>
    p {
      color: teal;
      font-size: 20px;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 style="color: crimson;">Three ways to add CSS</h1>
  <p>This paragraph is styled by the internal style tag.</p>
  <p>So is this one. One rule, many paragraphs.</p>
  <span class="badge">External CSS</span>
</body>
</html>
